[project]
name = "grillepain"
version = "0.1.0"
description = "Analyse de solos de guitare enregistrés avec JamCapture"
readme = "README.md"
authors = [
    { name = "Fabrice Jammes", email = "fabrice.jammes@clermont.in2p3.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "librosa",
    "numpy",
]

[project.scripts]
grillepain = "grillepain.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "jsonschema",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
